<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colors Token Diff</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Colors Token Diff</h1>
          <p>Переезд Colors в систему Primitives + Semantic</p>
        </div>
        <div class="topbar-actions">
          <button class="feedback-link" id="feedbackButton" type="button">Сообщить про цвет</button>
          <button class="icon-button" id="copySummary" title="Скопировать сводку" aria-label="Скопировать сводку">
            <span aria-hidden="true">⧉</span>
          </button>
          <a class="download-link" href="./token-diff-data.json" download>JSON</a>
        </div>
      </header>

      <section class="search-hero">
        <label for="search">Найти цвет, токен, primitive, Hex или CSS var</label>
        <input id="search" type="search" placeholder="Например: Black/100, #000000, Secondary, --depot-color-text-primary" />
      </section>

      <section class="workspace">
        <aside class="sidebar">
          <nav class="tabs" id="tabs" aria-label="Разделы сравнения"></nav>
        </aside>

        <section class="content">
          <div class="content-header">
            <div>
              <h2 id="viewTitle"></h2>
              <p id="viewDescription"></p>
            </div>
            <div class="result-count" id="resultCount"></div>
          </div>
          <div id="content"></div>
        </section>
      </section>
    </main>

    <div class="modal-backdrop" id="feedbackModal" hidden>
      <form class="feedback-modal" id="feedbackForm">
        <div class="modal-head">
          <div>
            <h2>Комментарий по цвету</h2>
            <p>Сохранится локально в этом браузере. Потом можно выгрузить все комментарии JSON-файлом.</p>
          </div>
          <button class="icon-button" id="closeFeedback" type="button" aria-label="Закрыть">×</button>
        </div>

        <label>
          Токен, primitive или Hex
          <input id="feedbackToken" name="token" type="text" placeholder="Например: Black/75, #000000 / 75%, Text&Icons/Secondary" required />
        </label>

        <label>
          Что проверить
          <select id="feedbackType" name="type">
            <option>Цвет пропал</option>
            <option>Неверный primitive</option>
            <option>Неверная semantic-папка</option>
            <option>Неверно схлопнули значение</option>
            <option>Неиспользуемый primitive</option>
            <option>Другое</option>
          </select>
        </label>

        <label>
          Комментарий
          <textarea id="feedbackComment" name="comment" rows="4" placeholder="Что именно смущает?" required></textarea>
        </label>

        <label>
          Как должно быть
          <textarea id="feedbackExpected" name="expected" rows="3" placeholder="Какой primitive/semantic должен использоваться?"></textarea>
        </label>

        <label>
          Почему важно
          <textarea id="feedbackReason" name="reason" rows="2" placeholder="Контекст использования, риск, экран, компонент"></textarea>
        </label>

        <div class="modal-actions">
          <button class="secondary-button" id="cancelFeedback" type="button">Отмена</button>
          <button class="primary-button" type="submit">Сохранить комментарий</button>
        </div>
      </form>
    </div>

    <script src="./token-diff-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
